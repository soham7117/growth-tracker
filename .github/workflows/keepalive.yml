name: Supabase keep-alive

# Free Supabase projects are paused after a week without activity.
# This pings the public leaderboard function every 3 days. It does nothing unless the
# repository secrets SUPABASE_URL and SUPABASE_ANON_KEY are set.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not configured; nothing to do."
            exit 0
          fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/leaderboard" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_period":"week","p_limit":1}' > /dev/null
          echo "Pinged successfully."
