name: PR title

# Pull requests are squash-merged, so the PR title becomes the commit message on main.
# It must follow Conventional Commits: type(scope): summary
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{3,}$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "PR title must look like: type(scope): summary"
            echo "Types: feat fix docs style refactor perf test build ci chore revert"
            echo "Got: $TITLE"
            exit 1
          fi
